name: Owner Authorization

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Exact repository in owner/name form.
        required: true
        type: string
      pr_number:
        description: Exact pull request number.
        required: true
        type: string
      candidate_sha:
        description: Exact current pull-request SHA.
        required: true
        type: string
      branch:
        description: Target branch.
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read
  statuses: write

jobs:
  authorize:
    name: Authorize exact HIGH_RISK candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Collect Trusted Delivery authorization request
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          OWNER_LOGIN: pcvantol
          TARGET_BRANCH: ${{ inputs.branch }}
          TARGET_REPOSITORY: ${{ inputs.repository }}
          TARGET_SHA: ${{ inputs.candidate_sha }}
          TARGET_PR: ${{ inputs.pr_number }}
        with:
          script: |
            const fs = require("fs");
            if (process.env.TARGET_REPOSITORY !== process.env.GITHUB_REPOSITORY) throw new Error("repository must equal this workflow repository");
            if (!/^[0-9a-f]{40}$/.test(process.env.TARGET_SHA)) throw new Error("candidate_sha must be a full SHA");
            if (context.actor !== process.env.OWNER_LOGIN) throw new Error("GitHub actor is not the configured repository owner");
            const pr = await github.rest.pulls.get({owner: context.repo.owner, repo: context.repo.repo, pull_number: Number(process.env.TARGET_PR)});
            if (pr.data.base.ref !== process.env.TARGET_BRANCH || pr.data.head.sha !== process.env.TARGET_SHA) throw new Error("branch or candidate SHA does not match the current pull request");
            const statuses = await github.rest.repos.listCommitStatusesForRef({owner: context.repo.owner, repo: context.repo.repo, ref: process.env.TARGET_SHA});
            const ownerStatus = statuses.data
              .filter(status => status.context === "Owner Authorization")
              .sort((left, right) => right.id - left.id)[0];
            if (!ownerStatus || ownerStatus.state !== "failure" || !ownerStatus.description?.startsWith("HIGH_RISK")) throw new Error("Trusted Delivery does not require Owner Authorization for this exact HIGH_RISK SHA");
            const checks = await github.rest.checks.listForRef({owner: context.repo.owner, repo: context.repo.repo, ref: process.env.TARGET_SHA});
            const trustedDelivery = checks.data.check_runs.find(check => check.name === "Trusted Delivery qualification / Qualify trusted delivery");
            if (!trustedDelivery || trustedDelivery.status !== "completed" || trustedDelivery.conclusion !== "success") throw new Error("Trusted Delivery technical qualification is not PASS");
            fs.writeFileSync("owner-authorization-request.json", JSON.stringify({repository: process.env.TARGET_REPOSITORY, branch: process.env.TARGET_BRANCH, pr_number: Number(process.env.TARGET_PR), candidate_sha: process.env.TARGET_SHA, current_head_sha: pr.data.head.sha, classification: "HIGH_RISK", trusted_delivery_status: "PASS", authorization_status: "REQUIRED", owner: process.env.OWNER_LOGIN, github_actor: context.actor, workflow_run_id: String(context.runId)}));
      - name: Validate and produce immutable authorization evidence
        run: python tools/trusted_delivery/owner_authorization.py --request owner-authorization-request.json --evidence owner-authorization-evidence.json
      - name: Publish Owner Authorization status
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          TARGET_SHA: ${{ inputs.candidate_sha }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({owner: context.repo.owner, repo: context.repo.repo, sha: process.env.TARGET_SHA, context: "Owner Authorization", state: "success", description: "HIGH_RISK authorized for this exact SHA", target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trusted-delivery-owner-authorization-evidence
          path: owner-authorization-evidence.json
          if-no-files-found: error
