name: Golden Qualification

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  golden-smoke:
    name: Golden Smoke
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.14"
      - name: Run standalone Golden Smoke
        id: qualification
        run: |
          report_path="$(mktemp "${RUNNER_TEMP}/golden-smoke.XXXXXX.md")"
          echo "report_path=${report_path}" >> "$GITHUB_OUTPUT"
          python -m pip install .
          python -m unittest tests.engineering.test_engineering_platform_golden
          printf 'Engineering Platform Golden Smoke: PASS\n' > "${report_path}"
      - name: Publish bounded qualification summary
        if: ${{ success() && steps.qualification.outcome == 'success' }}
        run: cat "${{ steps.qualification.outputs.report_path }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary qualification report
        if: ${{ always() }}
        run: rm -f "${{ steps.qualification.outputs.report_path }}"

  golden-regression:
    name: Golden Regression
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.14"
      - name: Run standalone Golden Regression
        id: qualification
        run: |
          report_path="$(mktemp "${RUNNER_TEMP}/golden-regression.XXXXXX.md")"
          echo "report_path=${report_path}" >> "$GITHUB_OUTPUT"
          python -m pip install .
          python -m unittest tests.engineering.test_engineering_platform_golden
          printf 'Engineering Platform Golden Regression: PASS\n' > "${report_path}"
      - name: Publish bounded qualification summary
        if: ${{ success() && steps.qualification.outcome == 'success' }}
        run: cat "${{ steps.qualification.outputs.report_path }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary qualification report
        if: ${{ always() }}
        run: rm -f "${{ steps.qualification.outputs.report_path }}"
