name: Trusted AI actor validation

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.DJCONNECT_TRUSTED_DELIVERY_APP_ID }}
          private-key: ${{ secrets.DJCONNECT_TRUSTED_DELIVERY_PRIVATE_KEY }}
          installation-id: ${{ vars.DJCONNECT_TRUSTED_DELIVERY_INSTALLATION_ID }}
      - name: Validate installation and bounded branch/PR access
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          gh api repos/${GITHUB_REPOSITORY}/installation --jq '.id' >/dev/null
          branch="trusted-delivery-validation-${GITHUB_RUN_ID}"
          git config user.name "DJConnect Trusted Delivery[bot]"
          git config user.email "4281587+djconnect-trusted-delivery[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: validate trusted delivery actor"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${branch}"
          pr_url="$(gh pr create --base main --head "${branch}" --title "chore: trusted delivery actor validation" --body "Automated bounded capability validation; closes immediately.")"
          gh pr close "${pr_url}" --delete-branch
