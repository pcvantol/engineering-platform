name: Security baseline

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-security:
    name: Python dependency and static security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: {python-version: '3.14'}
      - run: python -m pip install build pip-audit 'bandit[toml]' cyclonedx-bom .
      - name: Audit resolved Python dependencies
        run: pip-audit
      - name: Scan EP production Python
        # Historical extraction contains documented medium-confidence dynamic
        # SQLite identifier findings. The baseline is retained for Phase 3;
        # fail closed for any high-severity finding rather than rewriting
        # production-proven migration code merely for scanner cosmetics.
        run: bandit -r src/engineering_platform --severity-level high
      - name: Build package and generate SBOM
        run: |
          python -m build
          sha256sum dist/* > dist/SHA256SUMS
          cyclonedx-py environment --output-file dist/engineering-platform.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engineering-platform-supply-chain-evidence
          path: dist/
