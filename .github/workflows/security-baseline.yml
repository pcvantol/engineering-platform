name: Security baseline

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-security:
    name: Python dependency and static security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: {python-version: '3.12'}
      - run: python -m pip install build pip-audit 'bandit[toml]' cyclonedx-bom .
      - name: Audit resolved Python dependencies
        run: pip-audit
      - name: Scan EP production Python
        run: bandit -r src/engineering_platform --severity-level medium
      - name: Build package and generate SBOM
        run: |
          python -m build
          sha256sum dist/* > dist/SHA256SUMS
          cyclonedx-py environment --output-file dist/engineering-platform.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engineering-platform-supply-chain-evidence
          path: dist/
