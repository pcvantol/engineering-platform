name: EP Server production release

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact already-merged origin/main commit to qualify and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: engineering-platform-production-release
  cancel-in-progress: false

jobs:
  release-context:
    name: Verify exact merged release source
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      candidate_sha: ${{ steps.release.outputs.candidate_sha }}
      operation_id: ${{ steps.release.outputs.operation_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - id: release
        name: Validate release branch and write canonical version
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$SOURCE_SHA" = "$(git rev-parse HEAD)" || {
            echo "Release checkout does not match requested source SHA." >&2
            exit 1
          }
          test "$SOURCE_SHA" = "$(git rev-parse origin/main)" || {
            echo "Release source must be the current protected main commit." >&2
            exit 1
          }
          test -z "$(git status --porcelain)" || {
            echo "The release checkout is not clean." >&2
            exit 1
          }
          VERSION="$(python3 - <<'PY'
          import tomllib
          print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])
          PY
          )"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "operation_id=ep-release-$VERSION-$SOURCE_SHA" >> "$GITHUB_OUTPUT"

  qualify-production-wheel:
    name: Qualify clean production wheel
    needs: release-context
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          ref: ${{ needs.release-context.outputs.candidate_sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: {python-version: '3.12'}
      - name: Verify clean release checkout
        run: |
          test -z "$(git status --porcelain)"
          test "$(python3 - <<'PY'
          import tomllib
          print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])
          PY
          )" = "${{ needs.release-context.outputs.version }}"
      - name: Install release qualification tools
        run: python3 -m pip install build coverage pip-audit 'bandit[toml]' cyclonedx-bom twine
      - name: Build exact production distributions
        env:
          ENGINEERING_PLATFORM_RELEASE_MODE: production
        run: |
          python3 tools/qualification/build_platform_wheel.py --source-root . --version "${{ needs.release-context.outputs.version }}" --sdist
          test -z "$(git diff --name-only)"
          python3 -m twine check dist/*
          sha256sum dist/* > dist/SHA256SUMS
          python3 tools/qualification/production_wheel_qualification.py --source-root . --wheel "dist/engineering_platform-${{ needs.release-context.outputs.version }}-py3-none-any.whl" --version "${{ needs.release-context.outputs.version }}" --evidence dist/production-wheel-qualification.json
      - name: Run required source, API and installed-ingress qualification
        run: |
          python3 -m pip install "dist/engineering_platform-${{ needs.release-context.outputs.version }}-py3-none-any.whl"
          python3 -m compileall -q src/engineering_platform
          PYTHONPATH=src python3 tools/qualification/console_route_ownership_guard.py --source-root src
          python3 tools/qualification/platform_version_consistency.py --source-root . --installed-python "$(command -v python3)"
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 tools/qualification/p_transport_installed_ingress_matrix.py --source-root .
          # This uses an isolated CENTRAL root and local bare Git origin; the
          # release gate never writes to an external GitHub repository.
          python3 tools/qualification/p_deterministic_execution_e2e.py --source-root .
          PYTHONPATH=src python3 tools/qualification/http_json_postman_contract.py --source-root .
      - name: Enforce production coverage and security gates
        run: |
          coverage run --branch --source=engineering_platform -m unittest discover -s tests/engineering
          coverage json -o dist/engineering-platform-coverage.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('dist/engineering-platform-coverage.json').read_text())
          if report['totals']['percent_covered'] < 80.00:
              raise SystemExit(f"production coverage below 80.00%: {report['totals']['percent_covered']:.2f}%")
          print(f"EP_PRODUCTION_COVERAGE=PASS percent={report['totals']['percent_covered']:.2f}")
          PY
          pip-audit
          bandit -r src/engineering_platform --severity-level high
      - name: Prove a fresh installed runtime contains the canonical release
        env:
          VERSION: ${{ needs.release-context.outputs.version }}
        run: |
          python3 -m venv "$RUNNER_TEMP/ep-production"
          "$RUNNER_TEMP/ep-production/bin/pip" install --no-deps "dist/engineering_platform-$VERSION-py3-none-any.whl"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/ep-production/bin/python" -I -c 'from importlib.metadata import version; from engineering_platform.platform_version import CURRENT_PLATFORM_VERSION; import engineering_platform; import pathlib; assert version("engineering-platform") == CURRENT_PLATFORM_VERSION == __import__("os").environ["VERSION"]; assert "engineering-platform-relocation" not in str(pathlib.Path(engineering_platform.__file__).resolve())'
          "$RUNNER_TEMP/ep-production/bin/engineering-platform-server" --help >/dev/null
      - name: Generate SBOM for the exact release runtime
        run: cyclonedx-py environment --output-file dist/engineering-platform.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engineering-platform-production-${{ needs.release-context.outputs.version }}-${{ needs.release-context.outputs.candidate_sha }}
          path: dist/
          if-no-files-found: error

  browser-dashboard:
    name: Qualify production dashboard
    needs: release-context
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          ref: ${{ needs.release-context.outputs.candidate_sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: {python-version: '3.12'}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v22
        with: {node-version: '22'}
      - run: python3 -m pip install . && npm ci && npx playwright install --with-deps chromium
      - run: npm run test:engineering-dashboard -- --reporter=dot
      - run: npm run test:ui-localization && node --test tests/engineering/ui_localization_contract.test.mjs

  retain-qualified-release-operation:
    name: Retain one fully qualified EP release operation
    needs: [release-context, qualify-production-wheel, browser-dashboard]
    runs-on: ubuntu-latest
    permissions:
      # The draft receipt is durable provenance before the PyPI side effect. It
      # does not publish an Engineering Platform release.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          ref: ${{ needs.release-context.outputs.candidate_sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: engineering-platform-production-${{ needs.release-context.outputs.version }}-${{ needs.release-context.outputs.candidate_sha }}
          path: dist
      - name: Bind all completed qualification to the exact distributions
        env:
          OPERATION_ID: ${{ needs.release-context.outputs.operation_id }}
          SOURCE_SHA: ${{ needs.release-context.outputs.candidate_sha }}
          VERSION: ${{ needs.release-context.outputs.version }}
        run: |
          set -euo pipefail
          mkdir release-operation
          PYTHONPATH=src python3 - <<'PY'
          import os
          from pathlib import Path
          from engineering_platform.release_operation import ReleaseOperation, ReleaseOperationStore

          version, source, operation_id = os.environ["VERSION"], os.environ["SOURCE_SHA"], os.environ["OPERATION_ID"]
          operation = ReleaseOperation.create(
              operation_id=operation_id,
              product="engineering-platform", component="server", version=version,
              policy_revision="ep-server-production-release-v1", source_revision=source,
              artifacts={
                  "wheel": ReleaseOperationStore.artifact_digest(Path("dist") / f"engineering_platform-{version}-py3-none-any.whl"),
                  "sdist": ReleaseOperationStore.artifact_digest(Path("dist") / f"engineering_platform-{version}.tar.gz"),
              },
          )
          store = ReleaseOperationStore(Path("release-operation"))
          store.acquire(operation.operation_id)
          try:
              qualified = store.prepare_qualified(
                  operation,
                  evidence={
                      "exact_main_sha": source,
                      "artifact_digests": dict(operation.artifacts),
                      "qualification": "ep-production-wheel-api-security-browser-installed-v1",
                  },
              )
              if qualified.state != "QUALIFIED":
                  raise SystemExit("release operation is not qualified before publication")
          finally:
              store.release(operation.operation_id)
          PY
      - name: Persist the qualified operation outside the runner before PyPI
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION_ID: ${{ needs.release-context.outputs.operation_id }}
          SOURCE_SHA: ${{ needs.release-context.outputs.candidate_sha }}
          VERSION: ${{ needs.release-context.outputs.version }}
        run: |
          set -euo pipefail
          TAG="engineering-platform-v$VERSION"
          QUALIFIED="engineering-platform-release-qualified-$VERSION-$SOURCE_SHA.json"
          cp "release-operation/operations/$OPERATION_ID.json" "$QUALIFIED"
          if gh release view "$TAG" --json targetCommitish >/dev/null 2>&1; then
            test "$(gh release view "$TAG" --json targetCommitish --jq .targetCommitish)" = "$SOURCE_SHA"
            mkdir "$RUNNER_TEMP/ep-qualified-readback"
            if ! gh release download "$TAG" --pattern "$QUALIFIED" --dir "$RUNNER_TEMP/ep-qualified-readback"; then
              echo 'Existing EP release lacks its original durable qualified-operation receipt.' >&2
              exit 1
            fi
            cmp "$QUALIFIED" "$RUNNER_TEMP/ep-qualified-readback/$QUALIFIED"
          else
            status_code="$(curl --silent --show-error --location --output pypi.json --write-out '%{http_code}' "https://pypi.org/pypi/engineering-platform/$VERSION/json")" || {
              echo 'PyPI identity lookup failed before durable operation retention.' >&2
              exit 1
            }
            case "$status_code" in
              404) gh release create "$TAG" "$QUALIFIED" --draft --target "$SOURCE_SHA" --title "Engineering Platform $VERSION" ;;
              200) echo 'Existing PyPI publication has no durable original EP release receipt.' >&2; exit 1 ;;
              *) echo "Unexpected PyPI identity lookup status: $status_code" >&2; exit 1 ;;
            esac
          fi
          rm -f pypi.json "$QUALIFIED"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engineering-platform-qualified-${{ needs.release-context.outputs.version }}-${{ needs.release-context.outputs.candidate_sha }}
          path: |
            dist/
            release-operation/
          if-no-files-found: error

  publish-pypi:
    name: Publish qualified EP Server release to PyPI
    needs: [release-context, retain-qualified-release-operation]
    if: needs.retain-qualified-release-operation.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # PyPI Trusted Publishing exchanges this ephemeral GitHub OIDC token
      # for a project- and workflow-bound publication credential.
      id-token: write
    outputs:
      already_published: ${{ steps.existing.outputs.already_published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          ref: ${{ needs.release-context.outputs.candidate_sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: engineering-platform-qualified-${{ needs.release-context.outputs.version }}-${{ needs.release-context.outputs.candidate_sha }}
          path: release-input
      - name: Select only Python distributions for publication
        run: |
          set -euo pipefail
          mkdir pypi-dist
          VERSION="${{ needs.release-context.outputs.version }}"
          cp "release-input/dist/engineering_platform-$VERSION-py3-none-any.whl" pypi-dist/
          cp "release-input/dist/engineering_platform-$VERSION.tar.gz" pypi-dist/
          test "$(find pypi-dist -type f | wc -l)" = 2
      - name: Verify local and durable qualified operations before PyPI mutation
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION_ID: ${{ needs.release-context.outputs.operation_id }}
          VERSION: ${{ needs.release-context.outputs.version }}
          SOURCE_SHA: ${{ needs.release-context.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          PYTHONPATH=src python3 - <<'PY'
          import os
          from pathlib import Path
          from engineering_platform.release_operation import ReleaseOperation, ReleaseOperationStore

          version, source, operation_id = os.environ["VERSION"], os.environ["SOURCE_SHA"], os.environ["OPERATION_ID"]
          operation = ReleaseOperation.create(
              operation_id=operation_id,
              product="engineering-platform", component="server", version=version,
              policy_revision="ep-server-production-release-v1", source_revision=source,
              artifacts={
                  "wheel": ReleaseOperationStore.artifact_digest(Path("pypi-dist") / f"engineering_platform-{version}-py3-none-any.whl"),
                  "sdist": ReleaseOperationStore.artifact_digest(Path("pypi-dist") / f"engineering_platform-{version}.tar.gz"),
              },
          )
          store = ReleaseOperationStore(Path("release-input/release-operation"))
          store.acquire(operation.operation_id)
          try:
              qualified = store.prepare_qualified(
                  operation,
                  evidence={
                      "exact_main_sha": source,
                      "artifact_digests": dict(operation.artifacts),
                      "qualification": "ep-production-wheel-api-security-browser-installed-v1",
                  },
              )
              if qualified.state != "QUALIFIED":
                  raise SystemExit("release operation cannot be published from a non-qualified state")
          finally:
              store.release(operation.operation_id)
          PY
          TAG="engineering-platform-v$VERSION"
          QUALIFIED="engineering-platform-release-qualified-$VERSION-$SOURCE_SHA.json"
          mkdir "$RUNNER_TEMP/ep-qualified-readback"
          gh release download "$TAG" --pattern "$QUALIFIED" --dir "$RUNNER_TEMP/ep-qualified-readback"
          cmp "release-input/release-operation/operations/$OPERATION_ID.json" \
            "$RUNNER_TEMP/ep-qualified-readback/$QUALIFIED"
      - id: existing
        name: Refuse an existing version with different artifact bytes
        env:
          VERSION: ${{ needs.release-context.outputs.version }}
        run: |
          set -euo pipefail
          status_code="$(curl --silent --show-error --location --output pypi.json --write-out '%{http_code}' "https://pypi.org/pypi/engineering-platform/$VERSION/json")" || {
            echo 'PyPI identity lookup failed.' >&2
            exit 1
          }
          case "$status_code" in
            404) echo 'already_published=false' >> "$GITHUB_OUTPUT"; exit 0 ;;
            200) ;;
            *) echo "Unexpected PyPI identity lookup status: $status_code" >&2; exit 1 ;;
          esac
          python3 - "$VERSION" pypi.json <<'PY'
          from hashlib import sha256
          import json, sys
          from pathlib import Path
          version, index = sys.argv[1:]
          expected = {path.name: sha256(path.read_bytes()).hexdigest() for path in Path('pypi-dist').iterdir()}
          actual = {item['filename']: item['digests']['sha256'] for item in json.loads(Path(index).read_text())['urls']}
          wanted = {f'engineering_platform-{version}-py3-none-any.whl', f'engineering_platform-{version}.tar.gz'}
          if set(expected) != wanted or any(actual.get(name) != expected[name] for name in wanted):
              raise SystemExit('PUBLICATION_IDENTITY_CONFLICT')
          PY
          echo 'already_published=true' >> "$GITHUB_OUTPUT"
      - name: Publish only the qualified immutable distributions
        if: steps.existing.outputs.already_published != 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1, verified 2026-07-16
        with:
          packages-dir: pypi-dist

  registry-readback-and-published-evidence:
    name: Verify PyPI readback and retain PUBLISHED evidence
    needs: [release-context, retain-qualified-release-operation, publish-pypi]
    if: needs.publish-pypi.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          ref: ${{ needs.release-context.outputs.candidate_sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: engineering-platform-qualified-${{ needs.release-context.outputs.version }}-${{ needs.release-context.outputs.candidate_sha }}
          path: release-input
      - name: Read back and hash both exact immutable distributions from PyPI
        env:
          VERSION: ${{ needs.release-context.outputs.version }}
        run: |
          set -euo pipefail
          mkdir registry-readback
          python3 -m pip download --disable-pip-version-check --no-cache-dir --no-deps --only-binary=:all: --index-url https://pypi.org/simple --dest registry-readback "engineering-platform==$VERSION"
          python3 -m pip download --disable-pip-version-check --no-cache-dir --no-deps --no-binary=:all: --index-url https://pypi.org/simple --dest registry-readback "engineering-platform==$VERSION"
          PYTHONPATH=src python3 - <<'PY'
          from hashlib import sha256
          import json
          from pathlib import Path

          qualified = {path.name: sha256(path.read_bytes()).hexdigest()
                       for path in Path("release-input/dist").glob("engineering_platform-*")
                       if path.suffix in {".whl", ".gz"}}
          readback = {path.name: sha256(path.read_bytes()).hexdigest()
                      for path in Path("registry-readback").iterdir() if path.is_file()}
          if len(qualified) != 2 or set(readback) != set(qualified) or readback != qualified:
              raise SystemExit("PyPI readback does not match the exact qualified distributions")
          Path("release-input/release-operation/registry-readback-digests.json").write_text(
              json.dumps({
                  "registry": "pypi",
                  "observed_artifact_digests": {name: "sha256:" + digest for name, digest in readback.items()},
              }, sort_keys=True) + "\n",
              encoding="utf-8")
          PY
      - name: Qualify the actual registry wheel outside the source checkout
        env:
          VERSION: ${{ needs.release-context.outputs.version }}
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/ep-registry-readback"
          "$RUNNER_TEMP/ep-registry-readback/bin/pip" install --no-deps "registry-readback/engineering_platform-$VERSION-py3-none-any.whl"
          cd "$RUNNER_TEMP"
          PYTHONNOUSERSITE=1 PYTHONSAFEPATH=1 "$RUNNER_TEMP/ep-registry-readback/bin/python" -I -c 'from importlib.metadata import version; from engineering_platform.platform_version import CURRENT_PLATFORM_VERSION; import engineering_platform; import pathlib; assert version("engineering-platform") == CURRENT_PLATFORM_VERSION == __import__("os").environ["VERSION"]; assert "/site-packages/engineering_platform/" in str(pathlib.Path(engineering_platform.__file__).resolve())'
          "$RUNNER_TEMP/ep-registry-readback/bin/engineering-platform-server" --help >/dev/null
      - name: Persist immutable PyPI readback as PUBLISHED evidence
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION_ID: ${{ needs.release-context.outputs.operation_id }}
          VERSION: ${{ needs.release-context.outputs.version }}
          SOURCE_SHA: ${{ needs.release-context.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          PYTHONPATH=src python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from engineering_platform.release_operation import ReleaseOperation, ReleaseOperationStore

          observed = json.loads(Path("release-input/release-operation/registry-readback-digests.json").read_text(encoding="utf-8"))
          version, source, operation_id = os.environ["VERSION"], os.environ["SOURCE_SHA"], os.environ["OPERATION_ID"]
          operation = ReleaseOperation.create(
              operation_id=operation_id,
              product="engineering-platform", component="server", version=version,
              policy_revision="ep-server-production-release-v1", source_revision=source,
              artifacts={
                  "wheel": ReleaseOperationStore.artifact_digest(Path("release-input/dist") / f"engineering_platform-{version}-py3-none-any.whl"),
                  "sdist": ReleaseOperationStore.artifact_digest(Path("release-input/dist") / f"engineering_platform-{version}.tar.gz"),
              },
          )
          store = ReleaseOperationStore(Path("release-input/release-operation"))
          store.acquire(operation.operation_id)
          try:
              qualified = store.prepare_qualified(
                  operation,
                  evidence={
                      "exact_main_sha": source,
                      "artifact_digests": dict(operation.artifacts),
                      "qualification": "ep-production-wheel-api-security-browser-installed-v1",
                  },
              )
              if qualified.state != "QUALIFIED":
                  raise SystemExit("published evidence cannot overwrite a non-qualified release operation")
              published = store.mark_published(operation, evidence={**observed, "readback": "PASS"})
              if published.state != "PUBLISHED":
                  raise SystemExit("release operation is not PUBLISHED after registry readback")
          finally:
              store.release(operation.operation_id)
          PY
          TAG="engineering-platform-v$VERSION"
          RECEIPT="engineering-platform-release-published-$VERSION-$SOURCE_SHA.json"
          cp "release-input/release-operation/operations/$OPERATION_ID.json" "$RECEIPT"
          test "$(gh release view "$TAG" --json targetCommitish --jq .targetCommitish)" = "$SOURCE_SHA"
          mkdir "$RUNNER_TEMP/ep-published-readback"
          if gh release download "$TAG" --pattern "$RECEIPT" --dir "$RUNNER_TEMP/ep-published-readback"; then
            cmp "$RECEIPT" "$RUNNER_TEMP/ep-published-readback/$RECEIPT"
          else
            gh release upload "$TAG" "$RECEIPT"
          fi
          rm -f "$RECEIPT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engineering-platform-published-evidence-${{ needs.release-context.outputs.version }}-${{ needs.release-context.outputs.candidate_sha }}
          path: |
            release-input/dist/
            release-input/release-operation/
          if-no-files-found: error

  record-release-complete:
    name: Complete cleanup after durable PUBLISHED evidence
    needs: [release-context, retain-qualified-release-operation, publish-pypi, registry-readback-and-published-evidence]
    if: needs.registry-readback-and-published-evidence.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          ref: ${{ needs.release-context.outputs.candidate_sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: engineering-platform-published-evidence-${{ needs.release-context.outputs.version }}-${{ needs.release-context.outputs.candidate_sha }}
          path: published-input
      - name: Clean exact operation-local paths before RELEASE_COMPLETE
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION_ID: ${{ needs.release-context.outputs.operation_id }}
          VERSION: ${{ needs.release-context.outputs.version }}
          SOURCE_SHA: ${{ needs.release-context.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          TAG="engineering-platform-v$VERSION"
          PUBLISHED_RECEIPT="engineering-platform-release-published-$VERSION-$SOURCE_SHA.json"
          PENDING="engineering-platform-cleanup-pending-$VERSION-$SOURCE_SHA.json"
          RECEIPT="engineering-platform-release-complete-$VERSION-$SOURCE_SHA.json"
          target_exists() {
            test -e "$1" || test -L "$1"
          }
          PENDING_READBACK_DIR=""
          cleanup_pending_readback() {
            local status=$?
            if test -n "$PENDING_READBACK_DIR" && target_exists "$PENDING_READBACK_DIR"; then
              if ! rm -rf -- "$PENDING_READBACK_DIR" || target_exists "$PENDING_READBACK_DIR"; then
                echo 'Pending receipt readback target remains after failed cleanup.' >&2
                status=1
              fi
            fi
            trap - EXIT
            exit "$status"
          }
          trap cleanup_pending_readback EXIT
          mkdir published-readback
          gh release download "$TAG" --pattern "$PUBLISHED_RECEIPT" --dir published-readback
          cmp "published-input/release-operation/operations/$OPERATION_ID.json" "published-readback/$PUBLISHED_RECEIPT"
          # A prior cleanup failure remains durable history rather than an
          # incidental failed runner.  Reload it before retrying cleanup so a
          # restart may only advance the exact pending operation to terminal
          # completion; it must not silently reconstruct a fresh PUBLISHED
          # record from an ephemeral artifact.
          PENDING_READBACK_DIR="$(mktemp -d "$RUNNER_TEMP/ep-pending-readback-XXXXXX")"
          # A failed asset download is not evidence that the asset is absent.
          # First obtain the release's complete asset identity list; only a
          # successful list that omits this exact name permits a fresh cleanup
          # attempt from PUBLISHED.  A listed receipt must be readable.
          PENDING_ASSET_NAMES="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          pending_receipt_present=0
          if printf '%s\n' "$PENDING_ASSET_NAMES" | grep -Fqx -- "$PENDING"; then
            gh release download "$TAG" --pattern "$PENDING" --dir "$PENDING_READBACK_DIR"
            test -f "$PENDING_READBACK_DIR/$PENDING"
            PYTHONPATH=src python3 - "$OPERATION_ID" \
              "published-input/release-operation/operations/$OPERATION_ID.json" \
              "$PENDING_READBACK_DIR/$PENDING" <<'PY'
          from dataclasses import asdict
          import json
          import sys
          from pathlib import Path
          from engineering_platform.release_operation import ReleaseOperation, ReleaseOperationError, ReleaseOperationStore

          operation_id, published_path, pending_path = sys.argv[1:]
          published_bytes = Path(published_path).read_bytes()
          pending_bytes = Path(pending_path).read_bytes()
          published = ReleaseOperation.parse(json.loads(published_bytes))
          pending = ReleaseOperation.parse(json.loads(pending_bytes))

          def canonical_bytes(operation):
              return (json.dumps(
                  asdict(operation), sort_keys=True, separators=(",", ":"), allow_nan=False,
              ) + "\\n").encode("utf-8")

          if (
              published_bytes != canonical_bytes(published)
              or pending_bytes != canonical_bytes(pending)
              or published.operation_id != operation_id
              or pending.operation_id != operation_id
              or published.state != "PUBLISHED"
              or pending.state != "CLEANUP_PENDING"
              or not ReleaseOperationStore.same_identity(published, pending)
              or pending.qualification != published.qualification
              or pending.publication_receipt != published.publication_receipt
          ):
            raise ReleaseOperationError("durable cleanup-pending receipt does not match PUBLISHED release identity")
          store = ReleaseOperationStore(Path("published-input/release-operation"))
          store.acquire(operation_id)
          try:
              current = store.load(operation_id)
              if current != published:
                  raise ReleaseOperationError("published release operation changed before pending recovery")
              store.replace(current, pending)
              store.record_publication(pending)
          finally:
              store.release(operation_id)
          PY
            pending_receipt_present=1
          fi
          PYTHONPATH=src python3 - "$OPERATION_ID" "$VERSION" "$SOURCE_SHA" <<'PY'
          import os
          import sys
          from pathlib import Path
          from engineering_platform.release_operation import ReleaseOperationError, ReleaseOperationStore

          operation_id, version, source = sys.argv[1:]
          store = ReleaseOperationStore(Path("published-input/release-operation"))
          store.acquire(operation_id)
          try:
              published = store.load(operation_id)
              if published is None or published.state not in {"PUBLISHED", "CLEANUP_PENDING"} or published.version != version or published.source_revision != source:
                  raise ReleaseOperationError("durable release evidence is not a resumable PUBLISHED operation")
          finally:
              store.release(operation_id)
          PY
          test -d published-readback || test -L published-readback
          test -d published-input/dist || test -L published-input/dist
          test -f published-input/release-operation/registry-readback-digests.json || test -L published-input/release-operation/registry-readback-digests.json
          cleanup_failed=0
          failed_targets=()
          for target in published-readback published-input/dist published-input/release-operation/registry-readback-digests.json "$PENDING_READBACK_DIR"; do
            if target_exists "$target"; then
              if ! rm -rf -- "$target" || target_exists "$target"; then
                cleanup_failed=1
                if test "$target" = "$PENDING_READBACK_DIR"; then
                  failed_targets+=("pending-readback")
                else
                  failed_targets+=("$target")
                fi
              fi
            fi
          done
          if test "$cleanup_failed" = 1; then
            if test "$pending_receipt_present" = 1; then
              echo 'Existing durable CLEANUP_PENDING receipt retained after repeat cleanup failure.' >&2
              exit 1
            fi
            python3 - "${failed_targets[@]}" > cleanup-pending.json <<'PY'
          import json
          import sys
          print(json.dumps({
              "result": "CLEANUP_PENDING",
              "targets": [
                  "published-readback",
                  "published-input/dist",
                  "published-input/release-operation/registry-readback-digests.json",
                  "pending-readback",
              ],
              "failed_targets": sys.argv[1:],
              "error": "failed to remove an operation-local temporary path",
          }, sort_keys=True))
          PY
            PYTHONPATH=src python3 - "$OPERATION_ID" <<'PY'
          import json
          import sys
          from pathlib import Path
          from engineering_platform.release_operation import ReleaseOperationError, ReleaseOperationStore

          operation_id = sys.argv[1]
          store = ReleaseOperationStore(Path("published-input/release-operation"))
          store.acquire(operation_id)
          try:
              current = store.load(operation_id)
              if current is None:
                  raise ReleaseOperationError("durable release evidence is unavailable")
              if current.state != "PUBLISHED":
                  raise ReleaseOperationError("durable release evidence is not a resumable cleanup operation")
              store.mark_cleanup_pending(
                  current,
                  evidence=json.loads(Path("cleanup-pending.json").read_text(encoding="utf-8")),
              )
          finally:
              store.release(operation_id)
          PY
            cp "published-input/release-operation/operations/$OPERATION_ID.json" "$PENDING"
            gh release upload "$TAG" "$PENDING"
            # The initial readback directory is a declared cleanup target.
            # Confirm a newly-uploaded receipt over stdout so confirmation
            # cannot recreate that target after it was proven absent.
            gh release download "$TAG" --pattern "$PENDING" --output - | cmp "$PENDING" -
            rm -f -- "$PENDING" cleanup-pending.json
            if target_exists "$PENDING" || target_exists cleanup-pending.json; then
              echo 'Temporary cleanup-pending evidence remains after durable confirmation.' >&2
              exit 1
            fi
            exit 1
          fi
          # The loop above has verified that this operation-local target is
          # gone.  Later receipt confirmation is stream-only, so disarm the
          # failure-path trap before terminalizing the operation.
          PENDING_READBACK_DIR=""
          if test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true; then
            gh release edit "$TAG" --draft=false
          fi
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = false
          PYTHONPATH=src python3 - "$OPERATION_ID" <<'PY'
          import sys
          from pathlib import Path
          from engineering_platform.release_operation import ReleaseOperationError, ReleaseOperationStore

          operation_id = sys.argv[1]
          store = ReleaseOperationStore(Path("published-input/release-operation"))
          store.acquire(operation_id)
          try:
              published = store.load(operation_id)
              if published is None:
                  raise ReleaseOperationError("durable release evidence is unavailable")
              store.complete(
                  published,
                  evidence={
                      "result": "COMPLETE",
                      "temporary_paths": [
                          "published-readback",
                          "published-input/dist",
                          "published-input/release-operation/registry-readback-digests.json",
                          "pending-readback",
                      ],
                      "github_release": {"draft": False},
                  },
              )
          finally:
              store.release(operation_id)
          PY
          cp "published-input/release-operation/operations/$OPERATION_ID.json" "$RECEIPT"
          # Completion receipt confirmation is stream-only: terminalization
          # must not create a new cleanup target after the cleanup evidence
          # was made durable.
          if gh release download "$TAG" --pattern "$RECEIPT" --output - | cmp "$RECEIPT" -; then
            :
          else
            gh release upload "$TAG" "$RECEIPT"
            gh release download "$TAG" --pattern "$RECEIPT" --output - | cmp "$RECEIPT" -
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engineering-platform-release-evidence-${{ needs.release-context.outputs.version }}-${{ needs.release-context.outputs.candidate_sha }}
          path: engineering-platform-release-complete-*.json
          if-no-files-found: error
