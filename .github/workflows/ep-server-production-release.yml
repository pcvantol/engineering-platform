name: EP Server production release

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact already-merged origin/main commit to qualify and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: engineering-platform-production-release
  cancel-in-progress: false

jobs:
  release-context:
    name: Verify exact merged release source
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      candidate_sha: ${{ steps.release.outputs.candidate_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - id: release
        name: Validate release branch and write canonical version
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$SOURCE_SHA" = "$(git rev-parse HEAD)" || {
            echo "Release checkout does not match requested source SHA." >&2
            exit 1
          }
          test "$SOURCE_SHA" = "$(git rev-parse origin/main)" || {
            echo "Release source must be the current protected main commit." >&2
            exit 1
          }
          test -z "$(git status --porcelain)" || {
            echo "The release checkout is not clean." >&2
            exit 1
          }
          VERSION="$(python3 - <<'PY'
          import tomllib
          print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])
          PY
          )"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

  qualify-production-wheel:
    name: Qualify clean production wheel
    needs: release-context
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          ref: ${{ needs.release-context.outputs.candidate_sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: {python-version: '3.12'}
      - name: Verify clean release checkout
        run: |
          test -z "$(git status --porcelain)"
          test "$(python3 - <<'PY'
          import tomllib
          print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])
          PY
          )" = "${{ needs.release-context.outputs.version }}"
      - name: Install release qualification tools
        run: python3 -m pip install build coverage pip-audit 'bandit[toml]' cyclonedx-bom twine
      - name: Build exact production distributions
        env:
          ENGINEERING_PLATFORM_RELEASE_MODE: production
        run: |
          python3 tools/qualification/build_platform_wheel.py --source-root . --version "${{ needs.release-context.outputs.version }}" --sdist
          test -z "$(git diff --name-only)"
          python3 -m twine check dist/*
          sha256sum dist/* > dist/SHA256SUMS
          python3 tools/qualification/production_wheel_qualification.py --source-root . --wheel "dist/engineering_platform-${{ needs.release-context.outputs.version }}-py3-none-any.whl" --version "${{ needs.release-context.outputs.version }}" --evidence dist/production-wheel-qualification.json
      - name: Run required source, API and installed-ingress qualification
        run: |
          python3 -m pip install "dist/engineering_platform-${{ needs.release-context.outputs.version }}-py3-none-any.whl"
          python3 -m compileall -q src/engineering_platform
          PYTHONPATH=src python3 tools/qualification/console_route_ownership_guard.py --source-root src
          python3 tools/qualification/platform_version_consistency.py --source-root . --installed-python "$(command -v python3)"
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 tools/qualification/p_transport_installed_ingress_matrix.py --source-root .
          # This uses an isolated CENTRAL root and local bare Git origin; the
          # release gate never writes to an external GitHub repository.
          python3 tools/qualification/p_deterministic_execution_e2e.py --source-root .
          PYTHONPATH=src python3 tools/qualification/http_json_postman_contract.py --source-root .
      - name: Enforce production coverage and security gates
        run: |
          coverage run --branch --source=engineering_platform -m unittest discover -s tests/engineering
          coverage json -o dist/engineering-platform-coverage.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('dist/engineering-platform-coverage.json').read_text())
          if report['totals']['percent_covered'] < 80.00:
              raise SystemExit(f"production coverage below 80.00%: {report['totals']['percent_covered']:.2f}%")
          print(f"EP_PRODUCTION_COVERAGE=PASS percent={report['totals']['percent_covered']:.2f}")
          PY
          pip-audit
          bandit -r src/engineering_platform --severity-level high
      - name: Prove a fresh installed runtime contains the canonical release
        env:
          VERSION: ${{ needs.release-context.outputs.version }}
        run: |
          python3 -m venv "$RUNNER_TEMP/ep-production"
          "$RUNNER_TEMP/ep-production/bin/pip" install --no-deps "dist/engineering_platform-$VERSION-py3-none-any.whl"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/ep-production/bin/python" -I -c 'from importlib.metadata import version; from engineering_platform.platform_version import CURRENT_PLATFORM_VERSION; import engineering_platform; import pathlib; assert version("engineering-platform") == CURRENT_PLATFORM_VERSION == __import__("os").environ["VERSION"]; assert "engineering-platform-relocation" not in str(pathlib.Path(engineering_platform.__file__).resolve())'
          "$RUNNER_TEMP/ep-production/bin/engineering-platform-server" --help >/dev/null
      - name: Generate SBOM for the exact release runtime
        run: cyclonedx-py environment --output-file dist/engineering-platform.cdx.json
      - name: Persist the exact qualified release operation before publication
        env:
          VERSION: ${{ needs.release-context.outputs.version }}
          SOURCE_SHA: ${{ needs.release-context.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          mkdir release-operation
          PYTHONPATH=src python3 - <<'PY'
          import os
          from pathlib import Path
          from engineering_platform.release_operation import ReleaseOperation, ReleaseOperationStore

          version, source = os.environ["VERSION"], os.environ["SOURCE_SHA"]
          operation = ReleaseOperation.create(
              operation_id=f"release-{version}-{source[:12]}",
              product="engineering-platform", component="server", version=version,
              policy_revision="ep-server-production-release-v1", source_revision=source,
              artifacts={
                  "wheel": ReleaseOperationStore.artifact_digest(Path("dist") / f"engineering_platform-{version}-py3-none-any.whl"),
                  "sdist": ReleaseOperationStore.artifact_digest(Path("dist") / f"engineering_platform-{version}.tar.gz"),
              },
          )
          store = ReleaseOperationStore(Path("release-operation"))
          store.acquire(operation.operation_id)
          try:
              qualified = store.prepare_qualified(
                  operation,
                  evidence={"exact_main_sha": source, "artifact_digests": dict(operation.artifacts)},
              )
              if qualified.state != "QUALIFIED":
                  raise SystemExit("release operation is not qualified before publication")
          finally:
              store.release(operation.operation_id)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engineering-platform-production-${{ needs.release-context.outputs.version }}
          path: |
            dist/
            release-operation/
          if-no-files-found: error

  browser-dashboard:
    name: Qualify production dashboard
    needs: release-context
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          ref: ${{ needs.release-context.outputs.candidate_sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: {python-version: '3.12'}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v22
        with: {node-version: '22'}
      - run: python3 -m pip install . && npm ci && npx playwright install --with-deps chromium
      - run: npm run test:engineering-dashboard -- --reporter=dot
      - run: npm run test:ui-localization && node --test tests/engineering/ui_localization_contract.test.mjs

  publish-pypi:
    name: Publish qualified EP Server release to PyPI
    needs: [release-context, qualify-production-wheel, browser-dashboard]
    if: needs.qualify-production-wheel.result == 'success' && needs.browser-dashboard.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      # PyPI Trusted Publishing exchanges this ephemeral GitHub OIDC token
      # for a project- and workflow-bound publication credential.
      id-token: write
    outputs:
      already_published: ${{ steps.existing.outputs.already_published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          ref: ${{ needs.release-context.outputs.candidate_sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: engineering-platform-production-${{ needs.release-context.outputs.version }}
          path: dist
      - name: Select only Python distributions for publication
        run: |
          mkdir pypi-dist
          cp dist/*.whl dist/*.tar.gz pypi-dist/
          test "$(find pypi-dist -type f | wc -l)" = 2
      - name: Verify the pre-publication operation binds these exact distributions
        env:
          VERSION: ${{ needs.release-context.outputs.version }}
          SOURCE_SHA: ${{ needs.release-context.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          PYTHONPATH=src python3 - <<'PY'
          import os
          from pathlib import Path
          from engineering_platform.release_operation import ReleaseOperation, ReleaseOperationStore

          version, source = os.environ["VERSION"], os.environ["SOURCE_SHA"]
          operation = ReleaseOperation.create(
              operation_id=f"release-{version}-{source[:12]}",
              product="engineering-platform", component="server", version=version,
              policy_revision="ep-server-production-release-v1", source_revision=source,
              artifacts={
                  "wheel": ReleaseOperationStore.artifact_digest(Path("pypi-dist") / f"engineering_platform-{version}-py3-none-any.whl"),
                  "sdist": ReleaseOperationStore.artifact_digest(Path("pypi-dist") / f"engineering_platform-{version}.tar.gz"),
              },
          )
          store = ReleaseOperationStore(Path("dist/release-operation"))
          store.acquire(operation.operation_id)
          try:
              qualified = store.prepare_qualified(
                  operation,
                  evidence={"exact_main_sha": source, "artifact_digests": dict(operation.artifacts)},
              )
              if qualified.state != "QUALIFIED":
                  raise SystemExit("release operation cannot be published from a non-qualified state")
          finally:
              store.release(operation.operation_id)
          PY
      - id: existing
        name: Refuse an existing version with different artifact bytes
        env:
          VERSION: ${{ needs.release-context.outputs.version }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "https://pypi.org/pypi/engineering-platform/$VERSION/json" -o pypi.json || { echo 'already_published=false' >> "$GITHUB_OUTPUT"; exit 0; }
          python3 - "$VERSION" pypi.json <<'PY'
          from hashlib import sha256
          import json, sys
          from pathlib import Path
          version, index = sys.argv[1:]
          expected = {path.name: sha256(path.read_bytes()).hexdigest() for path in Path('pypi-dist').iterdir()}
          actual = {item['filename']: item['digests']['sha256'] for item in json.loads(Path(index).read_text())['urls']}
          wanted = {f'engineering_platform-{version}-py3-none-any.whl', f'engineering_platform-{version}.tar.gz'}
          if set(expected) != wanted or any(actual.get(name) != expected[name] for name in wanted):
              raise SystemExit('PUBLICATION_IDENTITY_CONFLICT')
          PY
          echo 'already_published=true' >> "$GITHUB_OUTPUT"
      - name: Publish only the qualified immutable distributions
        if: steps.existing.outputs.already_published != 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1, verified 2026-07-16
        with:
          packages-dir: pypi-dist

  registry-readback-and-published-evidence:
    name: Verify PyPI readback and retain PUBLISHED evidence
    needs: [release-context, publish-pypi]
    if: needs.publish-pypi.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          ref: ${{ needs.release-context.outputs.candidate_sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: engineering-platform-production-${{ needs.release-context.outputs.version }}
          path: qualified-dist
      - name: Read back exact immutable distributions from PyPI
        env:
          VERSION: ${{ needs.release-context.outputs.version }}
        run: |
          set -euo pipefail
          mkdir registry-readback
          python3 -m pip download --disable-pip-version-check --no-cache-dir --no-deps --only-binary=:all: --index-url https://pypi.org/simple --dest registry-readback "engineering-platform==$VERSION"
          python3 -m pip download --disable-pip-version-check --no-cache-dir --no-deps --no-binary=:all: --index-url https://pypi.org/simple --dest registry-readback "engineering-platform==$VERSION"
          PYTHONPATH=src python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          qualified = {path.name: sha256(path.read_bytes()).hexdigest()
                       for path in Path("qualified-dist").glob("engineering_platform-*")
                       if path.suffix in {".whl", ".gz"}}
          readback = {path.name: sha256(path.read_bytes()).hexdigest()
                      for path in Path("registry-readback").iterdir() if path.is_file()}
          if len(qualified) != 2 or set(readback) != set(qualified) or readback != qualified:
              raise SystemExit("PyPI readback does not match the exact qualified distributions")
          Path("registry-readback-digests.json").write_text(
              __import__("json").dumps({"registry": "pypi", "artifacts": readback}, sort_keys=True) + "\n",
              encoding="utf-8")
          PY
      - name: Persist immutable PyPI readback as PUBLISHED evidence
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release-context.outputs.version }}
          SOURCE_SHA: ${{ needs.release-context.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          PYTHONPATH=src python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from engineering_platform.release_operation import ReleaseOperation, ReleaseOperationStore

          digests = json.loads(Path("registry-readback-digests.json").read_text(encoding="utf-8"))["artifacts"]
          wheel = next(value for name, value in digests.items() if name.endswith(".whl"))
          sdist = next(value for name, value in digests.items() if name.endswith(".tar.gz"))
          source = os.environ["SOURCE_SHA"]
          operation = ReleaseOperation.create(
              operation_id=f"release-{os.environ['VERSION']}-{source[:12]}",
              product="engineering-platform", component="server", version=os.environ["VERSION"],
              policy_revision="ep-server-production-release-v1", source_revision=source,
              artifacts={"wheel": f"sha256:{wheel}", "sdist": f"sha256:{sdist}"},
          )
          qualified_store = ReleaseOperationStore(Path("qualified-dist/release-operation"))
          qualified = qualified_store.load(operation.operation_id)
          if qualified is None or qualified.state != "QUALIFIED" or not qualified_store.same_identity(qualified, operation):
              raise SystemExit("pre-publication release operation does not bind the registry-readback artifacts")
          store = ReleaseOperationStore(Path("release-evidence"))
          store.acquire(operation.operation_id)
          try:
              persisted = store.prepare_qualified(
                  operation,
                  evidence={"exact_main_sha": source, "artifact_digests": dict(operation.artifacts)},
              )
              if persisted.state != "QUALIFIED":
                  raise SystemExit("published evidence cannot overwrite a non-qualified release operation")
              published = persisted.transition("PUBLISHED", evidence={"registry": "pypi", "readback": digests})
              store.replace(persisted, published)
              store.record_publication(published)
          finally:
              store.release(operation.operation_id)
          PY
          TAG="engineering-platform-v$VERSION"
          RECEIPT="engineering-platform-release-published-$VERSION-$SOURCE_SHA.json"
          OPERATION="release-${VERSION}-${SOURCE_SHA:0:12}"
          cp "release-evidence/operations/$OPERATION.json" "$RECEIPT"
          if gh release view "$TAG" --json targetCommitish >/dev/null 2>&1; then
            test "$(gh release view "$TAG" --json targetCommitish --jq .targetCommitish)" = "$SOURCE_SHA"
            mkdir existing-release
            if gh release download "$TAG" --pattern "$RECEIPT" --dir existing-release; then
              cmp "$RECEIPT" "existing-release/$RECEIPT"
            else
              gh release upload "$TAG" "$RECEIPT"
            fi
          else
            gh release create "$TAG" "$RECEIPT" --target "$SOURCE_SHA" --title "Engineering Platform $VERSION" --generate-notes
          fi
          rm -rf registry-readback
          test ! -e registry-readback
          rm -rf existing-release
          test ! -e existing-release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engineering-platform-published-evidence-${{ needs.release-context.outputs.version }}-${{ needs.release-context.outputs.candidate_sha }}
          path: |
            registry-readback-digests.json
            engineering-platform-release-published-*.json
            release-evidence/
          if-no-files-found: error

  record-release-complete:
    name: Promote PUBLISHED evidence to RELEASE_COMPLETE
    needs: [release-context, registry-readback-and-published-evidence]
    if: needs.registry-readback-and-published-evidence.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          ref: ${{ needs.release-context.outputs.candidate_sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: engineering-platform-published-evidence-${{ needs.release-context.outputs.version }}-${{ needs.release-context.outputs.candidate_sha }}
          path: published-evidence
      - name: Validate immutable PUBLISHED evidence and record RELEASE_COMPLETE
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release-context.outputs.version }}
          SOURCE_SHA: ${{ needs.release-context.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          TAG="engineering-platform-v$VERSION"
          PUBLISHED_RECEIPT="engineering-platform-release-published-$VERSION-$SOURCE_SHA.json"
          RECEIPT="engineering-platform-release-complete-$VERSION-$SOURCE_SHA.json"
          OPERATION="release-${VERSION}-${SOURCE_SHA:0:12}"
          mkdir durable-evidence
          gh release download "$TAG" --pattern "$PUBLISHED_RECEIPT" --dir durable-evidence
          cmp "published-evidence/$PUBLISHED_RECEIPT" "durable-evidence/$PUBLISHED_RECEIPT"
          PYTHONPATH=src python3 - "$OPERATION" <<'PY'
          import os
          import sys
          from pathlib import Path
          from engineering_platform.release_operation import ReleaseOperationError, ReleaseOperationStore

          operation_id = sys.argv[1]
          store = ReleaseOperationStore(Path("published-evidence/release-evidence"))
          store.acquire(operation_id)
          try:
              published = store.load(operation_id)
              if published is None or published.state != "PUBLISHED":
                  raise ReleaseOperationError("durable release evidence is not PUBLISHED")
              completed = published.transition(
                  "RELEASE_COMPLETE",
                  evidence={"temporary_paths": ["registry-readback"], "result": "COMPLETE"},
              )
              store.replace(published, completed)
              store.record_publication(completed)
          finally:
              store.release(operation_id)
          Path(sys.argv[1] + ".json").write_text(
              (Path("published-evidence/release-evidence/operations") / (operation_id + ".json")).read_text(),
              encoding="utf-8",
          )
          PY
          mv "$OPERATION.json" "$RECEIPT"
          if gh release download "$TAG" --pattern "$RECEIPT" --dir durable-evidence; then
            cmp "$RECEIPT" "durable-evidence/$RECEIPT"
          else
            gh release upload "$TAG" "$RECEIPT"
          fi
          rm -rf durable-evidence
          test ! -e durable-evidence
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engineering-platform-release-evidence-${{ needs.release-context.outputs.version }}-${{ needs.release-context.outputs.candidate_sha }}
          path: |
            published-evidence/
            engineering-platform-release-complete-*.json
          if-no-files-found: error
