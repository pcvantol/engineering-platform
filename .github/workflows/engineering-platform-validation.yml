name: Engineering Platform validation

on:
  pull_request:
    paths:
      - 'src/engineering_platform/**'
      - 'tests/engineering/**'
      - 'docs/engineering/**'
      - 'docs/development/**'
      - 'docs/ai-development/**'
      - 'docs/governance/**'
      - 'BOOTSTRAP.md'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.mjs'
      - 'pyproject.toml'
      - 'tools/qualification/**'
      - '.github/workflows/engineering-platform-validation.yml'
  push:
    branches: [main]
    paths:
      - 'src/engineering_platform/**'
      - 'tests/engineering/**'
      - 'docs/engineering/**'
      - 'docs/development/**'
      - 'docs/ai-development/**'
      - 'docs/governance/**'
      - 'BOOTSTRAP.md'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.mjs'
      - 'pyproject.toml'
      - 'tools/qualification/**'

jobs:
  projection:
    name: Validate AI-development projection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: {python-version: '3.12'}
      - name: Validate committed offline projection
        run: python3 docs/ai-development/validate_projection.py --profile engineering-platform --source-commit ec070e399ff4dbd92e760370002995fe4f4d52d6 --extension-identity ENGINEERING_PLATFORM_DEVELOPMENT_EXTENSION
  validation-profile:
    runs-on: ubuntu-latest
    outputs:
      tier: ${{ steps.profile.outputs.tier }}
      phase: ${{ steps.profile.outputs.phase }}
      browser_dashboard_required: ${{ steps.profile.outputs.browser_dashboard_required }}
      localization_required: ${{ steps.profile.outputs.localization_required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with: {fetch-depth: 0}
      - id: profile
        run: PYTHONPATH=src python3 -m engineering_platform.validation_profile --base "${{ github.event.pull_request.base.sha || github.event.before }}" --branch "${{ github.head_ref || github.ref_name }}" --github-output "$GITHUB_OUTPUT"
  validate:
    needs: validation-profile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: {python-version: '3.12'}
      - name: Build and install standalone Engineering Platform
        run: python3 -m pip install build coverage .
      - name: Import, bytecode and qualification smoke
        run: |
          python3 -c "import engineering_platform, engineering_platform.execution_host"
          python3 -m compileall -q src/engineering_platform
          PYTHONPATH=src python3 tools/qualification/console_route_ownership_guard.py --source-root src
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Qualify installed P-TRANSPORT 3×2 ingress matrix
        run: python3 tools/qualification/p_transport_installed_ingress_matrix.py --source-root .
      - name: Enforce Engineering Platform coverage contract
        run: |
          # The standalone package is installed before this job runs.  Tell
          # Coverage explicitly to measure that installed runtime authority;
          # otherwise its default file-discovery scope records only tests.
          coverage run --branch --source=engineering_platform -m unittest discover -s tests/engineering
          coverage json -o engineering-platform-coverage.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          # The platform quality bar is deliberately above 80%, while leaving
          # a small, verified margin below the current dashboard evidence.
          minimum = 80.20
          targets = (
              "engineering_platform/dashboard.py",
              "engineering_platform/platform_bootstrap.py",
              "engineering_platform/providers.py",
              "engineering_platform/inbox_watcher.py",
          )
          report = json.loads(Path("engineering-platform-coverage.json").read_text())
          files = report["files"]
          failures = []
          for target in targets:
              matching_paths = [path for path in files if path.replace("\\\\", "/").endswith(target)]
              covered = (
                  files[matching_paths[0]]["summary"]["percent_covered"]
                  if len(matching_paths) == 1
                  else None
              )
              if covered is None or covered < minimum:
                  failures.append(f"{target}: {covered if covered is not None else 'missing'}% (minimum 80.20%)")
              else:
                  print(f"{target}: {covered:.2f}%")
          if failures:
              raise SystemExit("Engineering Platform coverage contract failed:\n" + "\n".join(failures))
          PY
  browser-dashboard:
    needs: validation-profile
    if: needs.validation-profile.outputs.browser_dashboard_required == 'true'
    runs-on: ubuntu-latest
    strategy:
      # The dashboard regression is intentionally complete, but split into
      # deterministic Playwright shards so both halves can use separate
      # GitHub runners and report their failures independently.
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - shard: "1/4"
            artifact_suffix: "1-of-4"
          - shard: "2/4"
            artifact_suffix: "2-of-4"
          - shard: "3/4"
            artifact_suffix: "3-of-4"
          - shard: "4/4"
            artifact_suffix: "4-of-4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: {python-version: '3.12'}
      - name: Install Engineering Platform runtime
        run: python3 -m pip install .
      - name: Install browser validation dependencies
        run: npm ci
      - name: Install Chromium for browser validation
        # ubuntu-latest already provides the system libraries Playwright needs.
        # Avoid refreshing third-party apt repositories here: their transient
        # availability must not make one dashboard shard fail before tests run.
        run: npx playwright install chromium
      - name: Browser smoke test for Engineering Status (shard ${{ matrix.shard }})
        # Keep successful runs compact; Playwright's dot reporter still emits
        # the full failure diagnostics, traces and artifact references.
        run: npm run test:engineering-dashboard -- --reporter=dot --shard=${{ matrix.shard }}
      - name: Upload Engineering Status browser screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engineering-status-browser-screenshots-${{ matrix.artifact_suffix }}
          path: |
            test-results/**
            tests/engineering/dashboard.spec.mjs-snapshots/**
          if-no-files-found: warn
  localization-gate:
    name: UI-GOLDEN-LOCALIZATION
    needs: validation-profile
    if: needs.validation-profile.outputs.localization_required == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v22
        with: {node-version: '22'}
      - name: Enforce five-locale Console contract
        run: npm run test:ui-localization && node --test tests/engineering/ui_localization_contract.test.mjs
  trusted-delivery-evidence:
    name: Qualify trusted delivery evidence
    needs: [validation-profile, validate, browser-dashboard, localization-gate]
    if: >-
      always() && needs.validate.result == 'success' &&
      (needs.validation-profile.outputs.browser_dashboard_required != 'true' ||
      needs.browser-dashboard.result == 'success') &&
      (needs.validation-profile.outputs.localization_required != 'true' ||
      needs.localization-gate.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: {python-version: '3.12'}
      - name: Verify standalone qualification evidence
        run: |
          python -m pip install build .
          python -m unittest tests.engineering.test_engineering_platform_golden
          PYTHONPATH=src python scripts/engineering/audit_ep_extraction_baseline.py --check
          python -c 'import engineering_platform, engineering_platform.execution_host'
