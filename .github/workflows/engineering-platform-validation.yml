name: Engineering Platform validation

on:
  pull_request:
    paths:
      - 'tools/engineering/**'
      - 'docs/engineering/**'
      - 'docs/development/ENGINEERING_PLATFORM_*.md'
      - 'BOOTSTRAP.md'
      - '.github/workflows/engineering-platform-validation.yml'
  push:
    branches: [main]
    paths:
      - 'tools/engineering/**'
      - 'docs/engineering/**'
      - 'docs/development/ENGINEERING_PLATFORM_*.md'
      - 'BOOTSTRAP.md'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: {python-version: '3.12'}
      - name: Version and configuration contracts
        run: python3 -c "from pathlib import Path; from tools.engineering.platform_api import PlatformConfiguration; from tools.engineering.platform_version import EngineeringPlatformManifest; r=Path('.'); assert PlatformConfiguration.load(r).platform.version == EngineeringPlatformManifest.load(r/'tools/engineering/ENGINEERING_PLATFORM_VERSION.json').platform_version"
      - name: Provider, qualification and golden scenario
        run: |
          python3 -m unittest tests.engineering.test_platform_productization tests.engineering.test_engineering_platform_golden
          ./tools/engineering/dj-engineer qualify
          python3 -c "from pathlib import Path; from tools.engineering.golden_scenario import run; assert run(Path('.'))['result'] == 'ENGINEERING_PLATFORM_GOLDEN_PASS'"
