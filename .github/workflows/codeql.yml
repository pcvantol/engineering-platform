name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "24 4 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL Python and JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with: {languages: python,javascript-typescript}
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
